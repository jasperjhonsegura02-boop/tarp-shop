<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign up | Tarp Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="register">
<header class="top"><a class="brand" href="index.html">Tarp Shop</a><nav id="nav"></nav></header>
<main>
<form id="form" class="card narrow">
  <h1>Create an account</h1>
  <p id="msg" hidden></p>
  <label>Full name<input name="name" required></label>
  <label>Email<input type="email" name="email" required></label>
  <label>Phone<input name="phone"></label>
  <label>Password<input type="password" name="password" minlength="6" required></label>
  <button class="btn">Create account</button>
</form>
</main>
<script src="common.js"></script>
<script src="pages.js"></script>
<script src="orders.js"></script>
<script src="boot.js"></script>
</body></html>
